name: UI Screenshots Audit

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Capture all native screens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run UI tests with screenshots enabled
        run: ./gradlew testDebugUnitTest --no-daemon --tests "ir.hsai.mobile.NativeUiTest"

      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-screenshots
          path: app/build/native-screenshots/
          if-no-files-found: warn
          retention-days: 14