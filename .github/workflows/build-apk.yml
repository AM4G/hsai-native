name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'ایجاد انتشار ریلیز در گیت‌هاب (Create GitHub Release)'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'نام تگ برای انتشار دستی (Custom tag e.g. v2.1.0)'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'یادداشت‌های انتشار سفارشی (Custom release notes)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/hsai-permanent.jks
            echo "Keystore successfully restored from KEYSTORE_BASE64 secret."
          elif [ -f "keystore/hsai-permanent.jks" ]; then
            echo "Using existing local keystore at keystore/hsai-permanent.jks."
          else
            echo "KEYSTORE_BASE64 secret not found; generating reproducible signing keystore."
            keytool -genkeypair -v -keystore keystore/hsai-permanent.jks -alias hsai-key -keyalg RSA -keysize 2048 -validity 10000 -storepass hsai2026pass -keypass hsai2026pass -dname "CN=HSAI, OU=Mobile, O=HaghSanj, L=Tehran, ST=Tehran, C=IR"
          fi

      - name: Run Unit Tests
        run: HSAI_SKIP_SCREENSHOTS=1 ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts and Checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/hsai-v2.1.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/hsai-v2.1.0-debug.apk
          cd release-artifacts
          sha256sum hsai-v2.1.0-release.apk hsai-v2.1.0-debug.apk > checksums.sha256
          echo "### 🛡️ SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat checksums.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Generated Checksums:"
          cat checksums.sha256

      - name: Upload APKs and Checksums as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hsai-native-v2.1.0-apks
          path: |
            release-artifacts/hsai-v2.1.0-release.apk
            release-artifacts/hsai-v2.1.0-debug.apk
            release-artifacts/checksums.sha256
          if-no-files-found: error

      - name: Resolve Release Tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || inputs.custom_tag != ''))
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.custom_tag }}" ]; then
            TAG_NAME="${{ inputs.custom_tag }}"
          else
            TAG_NAME="v2.1.0"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || inputs.custom_tag != ''))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "نسخه رسمی ${{ steps.release_meta.outputs.tag_name }} - اپلیکیشن اندروید بومی حق‌سنج"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/hsai-v2.1.0-release.apk
            release-artifacts/hsai-v2.1.0-debug.apk
            release-artifacts/checksums.sha256
          body: |
            ## ⚖️ انتشار رسمی نسخه اندروید بومی حق‌سنج (${{ steps.release_meta.outputs.tag_name }})

            این نسخه شامل جدیدترین به‌روزرسانی‌های امنیتی، هماهنگی کامل قراردادهای وب‌سرویس و قابلیت‌های بومی است:

            ### 🔒 امنیت و حریم خصوصی
            - **ذخیره‌سازی امن نشست و توکن‌ها**: رمزنگاری سخت‌افزاری با Android Keystore و کلید AES-GCM ۲۵۶ بیتی جهت جلوگیری از استخراج توکن‌های JWT (`SecureSession.kt`).
            - **قفل بایومتریک و پین دستگاه**: محافظت هوشمند از ورود به اپلیکیشن با اثر انگشت/تشخیص چهره و پین بدون وابستگی شخص ثالث و قفل شدن خودکار در خروج از برنامه (`AppLock.kt`).
            - **محافظت صفحه (`FLAG_SECURE`)**: مسدودسازی اسکرین‌شات، ضبط تصویر و پیش‌نمایش برنامه‌های اخیر در تمام صفحات اسناد، اسکنر و پرونده‌های حساس.
            - **پوشاندن اطلاعات حساس مدارک (`Redaction.kt`)**: ابزار محلی خط‌زدن کد ملی و شماره حساب‌ها پیش از ارسال به سرور.

            ### 📦 بسته‌های نصبی و راستی‌آزمایی
            - `hsai-v2.1.0-release.apk`: نسخه نهایی رسمی و امضاشده با کلید اصلی حق‌سنج (`hsai-key`)
            - `hsai-v2.1.0-debug.apk`: نسخه آزمایشی جهت خطایابی و تست‌های توسعه
            - `checksums.sha256`: مقادیر هش SHA-256 جهت اعتبارسنجی یکپارچگی فایل‌ها

            ${{ inputs.release_notes }}
